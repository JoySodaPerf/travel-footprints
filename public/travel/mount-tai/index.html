<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14453D">
  <meta name="description" content="旅游足迹 PWA：地图定位、景点打卡与背景介绍，陪你登上泰山之巅。">
  <title>泰山打卡 · 旅游足迹</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header">
    <div class="header-top">
      <span class="brand-title">泰山 · 打卡足迹</span>
      <div class="header-actions">
        <button id="settings-btn" class="chip" type="button" title="定位/通知/耗电设置">设置</button>
        <button id="sim-toggle" class="chip" type="button" title="模拟定位：在地图上点按放置测试位置">模拟</button>
        <button id="install-btn" class="chip hidden" type="button">安装应用</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-text" class="progress-text">0 / 11</span>
    </div>
  </header>

  <main id="map">
    <div id="geo-status" class="geo-chip">正在获取定位…</div>
  </main>

  <button id="locate-btn" class="locate-btn" type="button" title="回到我的位置">定位</button>

  <section id="sheet" class="sheet">
    <button id="sheet-toggle" class="sheet-toggle" type="button" aria-label="切换列表显示">
      <span class="chevron"></span>
      <span id="sheet-toggle-text">收起列表</span>
    </button>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/pois.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
